# Mô phỏng chi phí khi dùng thật — Track D1, phản ánh nhận thiếu món (guide bước 4.2).
# Mọi số về người dùng và tần suất là (tự ước tính): chưa có log sử dụng, phỏng vấn hay khảo sát.
# Đầu vào đề xuất của TV3: evidence/cp4/cost-handoff.json và evidence/impact.md mục 6.
# Chạy: python run.py simulate --wait 4   (gọi model thật, tốn quota)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # khách gặp sự cố CÓ DÙNG trợ lý trong một tháng, không phải toàn bộ khách nền
  low: 5
  base: 20
  high: 40
  source: "(tự ước tính) Cohort giả định 100 khách nền; 5 / 20 / 40 lấy từ cột N của bảng độ nhạy trong evidence/impact.md. Cơ sở 20 khớp spec.md §2. Giả định 100% khách gặp sự cố dùng trợ lý; chưa đo adoption."

personas:           # share là tỷ trọng người dùng, không phải tỷ trọng phiên; một phiên là một sự cố
  - name: khieu_nai_it
    share: 0.4
    uses_per_month: 1
    turns_per_session: 1
    source: "(tự ước tính) Số phiên/tháng theo spec.md §2 (8/20 người, 1 lần). Số lượt hỏi/phiên theo evidence/cp4/cost-handoff.json."
  - name: khieu_nai_vua
    share: 0.4
    uses_per_month: 2
    turns_per_session: 2
    source: "(tự ước tính) Số phiên/tháng theo spec.md §2 (8/20 người, 2 lần). Số lượt hỏi/phiên giả định có một lượt bổ sung thông tin."
  - name: khieu_nai_nhieu
    share: 0.2
    uses_per_month: 3
    turns_per_session: 3
    source: "(tự ước tính) Số phiên/tháng theo spec.md §2 (4/20 người, 3 lần). Số lượt hỏi/phiên giả định có nhiều lượt bổ sung."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# answer() không lưu ngữ cảnh giữa các lượt: mỗi lượt là một lần gọi độc lập.

prices:             # USD / 1 triệu token, giá chuẩn gói trả phí, chưa thuế
  - model: gemini-3.1-flash-lite      # mức rẻ (BTC gợi ý tầng Nhỏ)
    input: 0.25
    output: 1.50
    source: "further-reading/model-prices.md (bảng giá BTC) · https://ai.google.dev/gemini-api/docs/pricing · BTC tra ngày 25/11/2026"
  - model: gemini-4-hydrogen          # mức mạnh (BTC gợi ý tầng Lớn)
    input: 1.50
    output: 7.50
    source: "further-reading/model-prices.md (bảng giá BTC) · https://ai.google.dev/gemini-api/docs/pricing · BTC tra ngày 25/11/2026"

usd_to_vnd:         # không dùng: chi phí ghi bằng USD
  rate:
  source:
